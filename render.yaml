# Render Blueprint — deploy Sixpence as a single Docker container.
# Database is hosted externally (e.g. TiDB Cloud Serverless).
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sixpence
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: "UTC"
      - key: DB_TYPE
        value: "mysql"
      # Set these in the Render dashboard (not here) to keep secrets safe:
      # APP_URL, DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS
      # MAIL_DRIVER, MAIL_HOST, MAIL_PORT, etc.
