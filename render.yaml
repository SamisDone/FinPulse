# Render Blueprint — deploy Sixpence as a single Docker container plus a
# managed PostgreSQL database.
# https://render.com/docs/blueprint-spec
#
# NOTE: Render's free PostgreSQL instances expire 30 days after creation, with a
# 14-day grace period before the data is deleted. For anything you intend to keep,
# upgrade the database to a paid plan or point DATABASE_URL at a provider without
# an expiry (Neon and Supabase both have non-expiring free tiers).

databases:
  - name: sixpence-db
    plan: free
    databaseName: sixpence
    user: sixpence

services:
  - type: web
    name: sixpence
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: "UTC"
      # The connection string's postgres:// scheme selects the driver, so
      # DB_TYPE is not needed here.
      - key: DATABASE_URL
        fromDatabase:
          name: sixpence-db
          property: connectionString
      # Set these in the Render dashboard (not here) to keep secrets safe:
      # APP_URL, MAIL_DRIVER, MAIL_HOST, MAIL_PORT, etc.
