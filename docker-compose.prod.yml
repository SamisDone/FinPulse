# Production compose for AWS EC2.
# Uses Caddy as a reverse proxy for automatic HTTPS.

services:
  app:
    build: .
    volumes:
      - finpulse-storage:/var/www/html/storage
    env_file:
      - .env
    environment:
      - APP_DEBUG=false
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: finpulse
      MYSQL_USER: finpulse
      MYSQL_PASSWORD: ${DB_PASS:-changeme}
    volumes:
      - finpulse-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  finpulse-storage:
  finpulse-db:
  caddy-data:
  caddy-config:
