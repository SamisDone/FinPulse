<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Sixpence — a quiet ledger for income, spending, budgets and goals">
  <style>
    .bg { fill: #f5f3ee; }
    .card { fill: #ffffff; stroke: #e4e0d7; }
    .ink { fill: #1c1b18; }
    .ink-2 { fill: #57544c; }
    .ink-3 { fill: #85817a; }
    .grid { stroke: #ece9e2; }
    .tile { fill: #1c1b18; }
    .tile-line { stroke: #f5f3ee; }
    .in { fill: #0e7a4b; }
    .out { fill: #e0873a; }
    .pulse { stroke: #0e7a4b; }
    .track { fill: #eeebe4; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #12110f; }
      .card { fill: #1b1a17; stroke: #2d2b26; }
      .ink { fill: #f0ede6; }
      .ink-2 { fill: #b4afa4; }
      .ink-3 { fill: #807b71; }
      .grid { stroke: #2a2823; }
      .tile { fill: #f0ede6; }
      .tile-line { stroke: #12110f; }
      .in { fill: #178a6e; }
      .out { fill: #d27a2c; }
      .pulse { stroke: #3fae84; }
      .track { fill: #24221e; }
    }

    .serif { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; }
    .sans { font-family: "Geist", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }

    .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2.4s cubic-bezier(.22,1,.36,1) .3s forwards, breathe 4s ease-in-out 3s infinite; }
    .rise { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: rise .9s cubic-bezier(.22,1,.36,1) forwards; }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.22,1,.36,1) 1.1s forwards; }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 2s ease-in-out 2.6s infinite; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes rise { to { transform: scaleY(1); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.35); } 30% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .grow, .beat { animation: none; stroke-dashoffset: 0; transform: none; opacity: 1; }
    }
  </style>

  <rect class="bg" width="1280" height="320" rx="20"/>

  <!-- Brand -->
  <g class="fade" style="animation-delay:.05s">
    <rect class="tile" x="72" y="84" width="56" height="56" rx="15"/>
    <path class="tile-line" d="M84 118h10l5-13 8 22 5-13h10" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="in" cx="123" cy="114" r="3.6"/>
    <text class="ink serif" x="146" y="132" font-size="54" letter-spacing="-1">Sixpence</text>
  </g>
  <text class="ink-2 sans fade" style="animation-delay:.35s" x="74" y="190" font-size="22">Know where your money went, and where it's going.</text>
  <text class="ink-3 sans fade" style="animation-delay:.6s" x="74" y="228" font-size="16">Income · Spending · Budgets · Goals · No bank logins · No trackers</text>

  <!-- Mini chart card -->
  <g class="fade" style="animation-delay:.2s">
    <rect class="card" x="760" y="44" width="456" height="232" rx="16" stroke-width="1"/>
    <text class="ink-3 sans" x="788" y="80" font-size="13">Spending pace · September</text>
    <text class="ink serif" x="788" y="118" font-size="34">$1,871.71</text>
    <text class="ink-3 sans" x="930" y="117" font-size="13">left over</text>
    <line class="grid" x1="788" y1="236" x2="1188" y2="236" stroke-width="1"/>
    <line class="grid" x1="788" y1="196" x2="1188" y2="196" stroke-width="1"/>
    <line class="grid" x1="788" y1="156" x2="1188" y2="156" stroke-width="1"/>
  </g>

  <!-- Bars: income (green) and spending (orange) -->
  <g>
    <rect class="in rise"  style="animation-delay:.60s" x="800"  y="160" width="16" height="76" rx="3"/>
    <rect class="out rise" style="animation-delay:.66s" x="818"  y="196" width="16" height="40" rx="3"/>
    <rect class="in rise"  style="animation-delay:.72s" x="860"  y="152" width="16" height="84" rx="3"/>
    <rect class="out rise" style="animation-delay:.78s" x="878"  y="190" width="16" height="46" rx="3"/>
    <rect class="in rise"  style="animation-delay:.84s" x="920"  y="164" width="16" height="72" rx="3"/>
    <rect class="out rise" style="animation-delay:.90s" x="938"  y="194" width="16" height="42" rx="3"/>
    <rect class="in rise"  style="animation-delay:.96s" x="980"  y="146" width="16" height="90" rx="3"/>
    <rect class="out rise" style="animation-delay:1.02s" x="998" y="198" width="16" height="38" rx="3"/>
    <rect class="in rise"  style="animation-delay:1.08s" x="1040" y="170" width="16" height="66" rx="3"/>
    <rect class="out rise" style="animation-delay:1.14s" x="1058" y="192" width="16" height="44" rx="3"/>
    <rect class="in rise"  style="animation-delay:1.20s" x="1100" y="158" width="16" height="78" rx="3"/>
    <rect class="out rise" style="animation-delay:1.26s" x="1118" y="200" width="16" height="36" rx="3"/>
  </g>

  <!-- Budget progress -->
  <rect class="track" x="1152" y="80" width="40" height="6" rx="3"/>
  <rect class="in grow" x="1152" y="80" width="28" height="6" rx="3"/>

  <!-- Pulse line across the banner -->
  <path class="pulse draw" d="M74 272 H430 l14 -30 l22 58 l18 -46 l12 18 H700" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="in beat" cx="700" cy="272" r="6"/>
</svg>
