services:
  app:
    build: .
    ports:
      - "8000:80"
    volumes:
      - sixpence-storage:/var/www/html/storage
    env_file:
      - .env
    environment:
      - APP_URL=http://localhost:8000
    restart: unless-stopped

  # ── Optional: uncomment to use PostgreSQL instead of SQLite ─────────────────
  # Then set DATABASE_URL=postgres://sixpence:secret@db:5432/sixpence in .env
  # (a local host needs no TLS, so sslmode is left off).
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_DB: sixpence
  #     POSTGRES_USER: sixpence
  #     POSTGRES_PASSWORD: secret
  #   volumes:
  #     - sixpence-db:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

  # ── Or MySQL, with DATABASE_URL=mysql://sixpence:secret@db:3306/sixpence ────
  # db:
  #   image: mysql:8.0
  #   environment:
  #     MYSQL_ROOT_PASSWORD: secret
  #     MYSQL_DATABASE: sixpence
  #     MYSQL_USER: sixpence
  #     MYSQL_PASSWORD: secret
  #   volumes:
  #     - sixpence-db:/var/lib/mysql
  #   ports:
  #     - "3306:3306"
  #   restart: unless-stopped

volumes:
  sixpence-storage:
  # sixpence-db:
