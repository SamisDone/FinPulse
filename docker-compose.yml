services:
  app:
    build: .
    ports:
      - "8000:80"
    volumes:
      - sixpence-storage:/var/www/html/storage
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_URL=http://localhost:8000
      # A local server has no TLS, so sslmode is left off here.
      - DATABASE_URL=postgres://sixpence:secret@db:5432/sixpence
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sixpence
      POSTGRES_USER: sixpence
      POSTGRES_PASSWORD: secret
    volumes:
      - sixpence-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sixpence"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  sixpence-storage:
  sixpence-db:
