name: Tests

on:
  push:
  pull_request:

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} · SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, iconv, zlib, openssl
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Test
        run: php tests/run.php

  mysql:
    name: PHP 8.3 · MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sixpence_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, iconv, zlib, openssl
          coverage: none
      - name: Test
        run: php tests/run.php
        env:
          DB_TYPE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sixpence_test
          DB_USER: root
          DB_PASS: root

  postgres:
    name: PHP 8.3 · PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sixpence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, iconv, zlib, openssl
          coverage: none
      - name: Test
        run: php tests/run.php
        env:
          DB_TYPE: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: sixpence_test
          DB_USER: postgres
          DB_PASS: postgres
